[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lewis-agents"
version = "0.1.0"
description = "A LangGraph supervisor with coding, movie, and web agents"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "langchain-core>=0.3",
  "langchain-openai>=0.3",
  "langgraph>=0.2",
  "pydantic-settings>=2.6",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]
anthropic = ["langchain-anthropic>=0.3"]
google = ["langchain-google-genai>=2.0"]
mistral = ["langchain-mistralai>=0.2"]
ollama = ["langchain-ollama>=0.2"]
all-providers = [
  "langchain-anthropic>=0.3",
  "langchain-google-genai>=2.0",
  "langchain-mistralai>=0.2",
  "langchain-ollama>=0.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
